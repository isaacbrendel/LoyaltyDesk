[project]
name = "loyaltydesk"
version = "0.3.0"
description = "Production-style loyalty analyst agent platform — LangGraph, tool contracts, Snowflake-backed retrieval, evals, and guardrails."
readme = "README.md"
authors = [
    { name = "Isaac Brendel", email = "isaac@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
llm = [
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
loyaltydesk = "loyaltydesk.cli:main"
loyaltydesk-seed = "loyaltydesk.data.seed:main"
loyaltydesk-eval = "loyaltydesk.evals.harness:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
